<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sports Oracle & Multi-Match Acca Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#090d16', 800: '#111827', 700: '#1f293d', 600: '#334155' },
                        neon: { emerald: '#10b981', cyan: '#06b6d4', amber: '#f59e0b' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-emerald { box-shadow: 0 0 25px rgba(16, 185, 129, 0.25); }
    </style>
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white">

    <header class="border-b border-slate-800 bg-dark-800/50 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center glow-emerald shadow-lg">
                    <i class="fa-solid fa-bolt text-dark-900 text-lg font-bold"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">Sports Oracle AI</h1>
                    <p class="text-xs text-slate-400">Live API & Acca Optimizer</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 bg-dark-700/60 px-3 py-1.5 rounded-full border border-slate-700 text-xs text-emerald-400">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Live Feed Active</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Controls Column -->
        <div class="lg:col-span-1 space-y-6">
            <div class="glass-panel p-6 rounded-2xl shadow-xl space-y-6">
                <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-emerald-400"></i> Match Parameters
                </h2>

                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-300">Select Sports (1 to 6)</label>
                        <span id="sport-count-badge" class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-medium">3 selected</span>
                    </div>
                    <div id="sports-grid" class="grid grid-cols-2 gap-2"></div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-300">Time Window</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button type="button" onclick="setTimeWindow(6)" class="time-btn py-2 text-xs font-medium rounded-xl border border-slate-700 bg-dark-700/50 hover:border-emerald-500 transition text-slate-300">6h</button>
                        <button type="button" onclick="setTimeWindow(12)" class="time-btn py-2 text-xs font-medium rounded-xl border border-slate-700 bg-dark-700/50 hover:border-emerald-500 transition text-slate-300">12h</button>
                        <button type="button" onclick="setTimeWindow(24)" class="time-btn py-2 text-xs font-medium rounded-xl border border-emerald-500 bg-emerald-500/10 text-emerald-400 transition">24h</button>
                        <button type="button" onclick="setTimeWindow(72)" class="time-btn py-2 text-xs font-medium rounded-xl border border-slate-700 bg-dark-700/50 hover:border-emerald-500 transition text-slate-300">72h</button>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-300">Fixture Count</label>
                        <span id="match-count-val" class="text-sm font-bold text-emerald-400">5</span>
                    </div>
                    <input type="range" id="match-slider" min="3" max="10" value="5" class="w-full accent-emerald-500 bg-dark-700 h-2 rounded-lg cursor-pointer" oninput="document.getElementById('match-count-val').innerText = this.value">
                </div>

                <button onclick="fetchLiveFixtures()" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-dark-900 font-bold hover:opacity-90 transition shadow-lg glow-emerald flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Load Live Matches & Odds
                </button>
            </div>
        </div>

        <!-- Results & Acca Ticket Column -->
        <div class="lg:col-span-2 space-y-6 flex flex-col">
            <div class="glass-panel p-5 rounded-2xl border border-emerald-500/30 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold">
                        <i class="fa-solid fa-ticket"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-200">Accumulator Slip</h3>
                        <p class="text-xs text-slate-400"><span id="selected-count">0</span> selections added</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                    <div class="text-right">
                        <p class="text-xs text-slate-400">Combined Odds</p>
                        <p id="combined-odds" class="text-lg font-extrabold text-emerald-400">1.00x</p>
                    </div>
                    <button onclick="autoBuildBestAcca()" class="px-4 py-2 rounded-xl bg-dark-700 hover:bg-dark-600 border border-slate-600 text-xs font-semibold text-cyan-400 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-wand-sparkles"></i> Auto-Build Best Acca
                    </button>
                </div>
            </div>

            <div class="flex-1 space-y-4">
                <div class="flex items-center justify-between px-1">
                    <h2 class="font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-ranking-star text-cyan-400"></i> Upcoming Fixtures & Predictions
                    </h2>
                    <span id="fixture-meta" class="text-xs text-slate-400">Ready</span>
                </div>

                <div id="fixtures-container" class="space-y-4">
                    <div class="glass-panel p-12 rounded-2xl text-center space-y-4">
                        <div class="w-16 h-16 rounded-full bg-dark-700 mx-auto flex items-center justify-center text-slate-500 text-2xl">
                            <i class="fa-solid fa-futbol animate-bounce"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-300">Configure parameters and click load</h3>
                        <p class="text-sm text-slate-400 max-w-md mx-auto">Select your sports choices and load live matches from your API.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const availableSports = [
            { id: 'football', name: 'Football (Soccer)', icon: 'fa-futbol' },
            { id: 'basketball', name: 'Basketball', icon: 'fa-basketball' },
            { id: 'tennis', name: 'Tennis', icon: 'fa-baseball-bat-ball' },
            { id: 'esports', name: 'Esports', icon: 'fa-gamepad' },
            { id: 'icehockey', name: 'Ice Hockey', icon: 'fa-hockey-puck' },
            { id: 'mma', name: 'MMA / Boxing', icon: 'fa-hand-fist' }
        ];

        let selectedSports = ['football', 'basketball', 'tennis'];
        let currentTimeWindow = 24;
        let currentFixtures = [];
        let slipSelections = [];

        function renderSportsGrid() {
            const grid = document.getElementById('sports-grid');
            grid.innerHTML = availableSports.map(sport => {
                const isSelected = selectedSports.includes(sport.id);
                return `
                    <button type="button" onclick="toggleSport('${sport.id}')" class="flex items-center gap-2 p-2.5 rounded-xl border text-xs font-medium transition text-left ${isSelected ? 'border-emerald-500 bg-emerald-500/10 text-emerald-400 shadow-sm' : 'border-slate-700 bg-dark-700/40 text-slate-400 hover:border-slate-600'}">
                        <i class="fa-solid ${sport.icon} w-4 text-center"></i>
                        <span class="truncate">${sport.name}</span>
                    </button>
                `;
            }).join('');
            document.getElementById('sport-count-badge').innerText = `${selectedSports.length} selected`;
        }

        function toggleSport(id) {
            if (selectedSports.includes(id)) {
                if (selectedSports.length === 1) { alert("Please select at least 1 sport."); return; }
                selectedSports = selectedSports.filter(s => s !== id);
            } else {
                if (selectedSports.length >= 6) { alert("Maximum 6 sports allowed."); return; }
                selectedSports.push(id);
            }
            renderSportsGrid();
        }

        function setTimeWindow(hours) {
            currentTimeWindow = hours;
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.className = "time-btn py-2 text-xs font-medium rounded-xl border border-slate-700 bg-dark-700/50 hover:border-emerald-500 transition text-slate-300";
                if(btn.innerText.includes(hours)) {
                    btn.className = "time-btn py-2 text-xs font-medium rounded-xl border border-emerald-500 bg-emerald-500/10 text-emerald-400 transition";
                }
            });
        }

        async function fetchLiveFixtures() {
            const container = document.getElementById('fixtures-container');
            const count = parseInt(document.getElementById('match-slider').value);

            container.innerHTML = `
                <div class="glass-panel p-12 rounded-2xl text-center space-y-4">
                    <div class="w-12 h-12 rounded-full border-4 border-emerald-500 border-t-transparent animate-spin mx-auto"></div>
                    <h3 class="font-bold text-slate-200">Querying Live Database...</h3>
                    <p class="text-xs text-slate-400">Fetching matches and generating oracle predictions.</p>
                </div>
            `;

            try {
                const response = await fetch('/api/get-fixtures');
                const data = await response.json();
                
                if(data.error) {
                    container.innerHTML = `<div class="glass-panel p-6 text-red-400 text-center">Error: ${data.error}</div>`;
                    return;
                }

                currentFixtures = (data.fixtures || []).slice(0, count).map((f, i) => ({
                    ...f,
                    oddsA: +(Math.random() * 1.5 + 1.3).toFixed(2),
                    oddsB: +(Math.random() * 2.0 + 1.5).toFixed(2),
                    confidence: ['High', 'Medium', 'High'][i % 3],
                    analysis: `Recent form metrics indicate solid competitive advantage for ${f.homeTeam}.`
                }));

                slipSelections = [];
                renderFixtures();
                updateAccaSlip();
            } catch (err) {
                container.innerHTML = `<div class="glass-panel p-6 text-red-400 text-center">Failed to fetch fixtures.</div>`;
            }
        }

        function renderFixtures() {
            const container = document.getElementById('fixtures-container');
            document.getElementById('fixture-meta').innerText = `${currentFixtures.length} matches displayed`;

            if(currentFixtures.length === 0) {
                container.innerHTML = `<div class="glass-panel p-8 text-center text-slate-400">No matches found for current filters.</div>`;
                return;
            }

            container.innerHTML = currentFixtures.map((f, index) => {
                const isSelectedA = slipSelections.some(s => s.fixtureIndex === index && s.pick === 'A');
                const isSelectedB = slipSelections.some(s => s.fixtureIndex === index && s.pick === 'B');
                
                return `
                    <div class="glass-panel p-5 rounded-2xl space-y-4">
                        <div class="flex items-center justify-between text-xs text-slate-400 border-b border-slate-800 pb-2">
                            <span class="text-cyan-400 font-semibold uppercase"><i class="fa-solid fa-trophy mr-1"></i> ${f.league} &bull; ${f.country}</span>
                            <span><i class="fa-regular fa-clock mr-1"></i> ${f.time}</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                            <div class="md:col-span-1">
                                <h4 class="font-bold text-slate-100">${f.homeTeam}</h4>
                                <p class="text-xs text-slate-500">vs</p>
                                <h4 class="font-bold text-slate-100">${f.awayTeam}</h4>
                            </div>
                            <div class="md:col-span-2 grid grid-cols-2 gap-2">
                                <button onclick="toggleSelection(${index}, 'A', ${f.oddsA})" class="p-3 rounded-xl border text-center transition ${isSelectedA ? 'border-emerald-500 bg-emerald-500/20 text-emerald-300' : 'border-slate-700 bg-dark-700/40 text-slate-300 hover:border-slate-600'}">
                                    <div class="text-xs text-slate-400 truncate">${f.homeTeam}</div>
                                    <div class="text-sm font-extrabold text-emerald-400">${f.oddsA}</div>
                                </button>
                                <button onclick="toggleSelection(${index}, 'B', ${f.oddsB})" class="p-3 rounded-xl border text-center transition ${isSelectedB ? 'border-emerald-500 bg-emerald-500/20 text-emerald-300' : 'border-slate-700 bg-dark-700/40 text-slate-300 hover:border-slate-600'}">
                                    <div class="text-xs text-slate-400 truncate">${f.awayTeam}</div>
                                    <div class="text-sm font-extrabold text-emerald-400">${f.oddsB}</div>
                                </button>
                            </div>
                        </div>
                        <div class="bg-dark-900/60 p-3 rounded-xl flex items-start gap-2.5 border border-slate-800 text-xs">
                            <i class="fa-solid fa-brain text-cyan-400 mt-0.5"></i>
                            <div><span class="font-semibold text-slate-300">Oracle Insight (${f.confidence}):</span> <span class="text-slate-400">${f.analysis}</span></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleSelection(fixtureIndex, pick, odds) {
            const existingIndex = slipSelections.findIndex(s => s.fixtureIndex === fixtureIndex);
            if (existingIndex > -1) {
                if (slipSelections[existingIndex].pick === pick) { slipSelections.splice(existingIndex, 1); }
                else { slipSelections[existingIndex] = { fixtureIndex, pick, odds }; }
            } else {
                slipSelections.push({ fixtureIndex, pick, odds });
            }
            renderFixtures();
            updateAccaSlip();
        }

        function updateAccaSlip() {
            document.getElementById('selected-count').innerText = slipSelections.length;
            if (slipSelections.length === 0) { document.getElementById('combined-odds').innerText = '1.00x'; return; }
            const combined = slipSelections.reduce((acc, curr) => acc * curr.odds, 1);
            document.getElementById('combined-odds').innerText = combined.toFixed(2) + 'x';
        }

        function autoBuildBestAcca() {
            if (currentFixtures.length === 0) { alert("Load matches first!"); return; }
            slipSelections = [];
            currentFixtures.forEach((f, index) => {
                slipSelections.push({ fixtureIndex: index, pick: 'A', odds: f.oddsA });
            });
            renderFixtures();
            updateAccaSlip();
        }

        renderSportsGrid();
    </script>
</body>
</html>
